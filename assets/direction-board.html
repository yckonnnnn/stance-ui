<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zack UI · Direction Board</title>
  <style>
    :root { --bg:#f7f7f4; --ink:#111; --line:#c9c9c4; --accent:#111; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:"Helvetica Neue","PingFang SC",sans-serif; }
    header { padding:32px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:clamp(36px,5vw,72px); letter-spacing:-.06em; }
    p { color:#68665e; }
    main { display:grid; grid-template-columns:repeat(3,1fr); min-height:calc(100vh - 150px); }
    section { position:relative; padding:24px; border-right:1px solid var(--line); }
    section:last-child { border-right:0; }
    section > span { color:var(--accent); font:11px monospace; }
    section h2 { margin:44px 0 12px; font-size:clamp(28px,3vw,48px); line-height:1; letter-spacing:-.05em; }
    section iframe { width:100%; aspect-ratio:9/16; margin-top:24px; border:1px solid var(--ink); background:white; }
    @media (max-width:900px) { main { grid-template-columns:1fr; } section { border-right:0; border-bottom:1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <h1>Three directions, not three colourways.</h1>
    <p>用真实内容填满三个方向，再决定哪一个是产品本身。这里故意保持中性，不要把方向板自己的颜色带进成品。</p>
  </header>
  <main>
    <section><span>01 / EDITORIAL</span><h2>文字承担重心</h2><p>记录配色、字体、材质和构图假设。不要直接照搬方向板的中性灰。</p></section>
    <section><span>02 / OBJECT</span><h2>一个对象承担视觉</h2><p>说明这个对象为什么属于产品，并写出这一方向自己的色彩与材料。</p></section>
    <section><span>03 / SYSTEM</span><h2>秩序与工作对象</h2><p>说明信息密度、状态和操作链如何成立，不要复用上一套页面。</p></section>
  </main>
</body>
</html>
