name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill files
        run: |
          test -f SKILL.md
          test -f agents/openai.yaml
          test -f scripts/verify-install.sh
          test -f references/web-pages.md
          test -f references/mobile-apps.md
          test -f references/design-direction.md
          test -f references/style-diversity.md
          test -f references/quality-floor.md
          test -f references/typography-color.md
          test -f references/layout-components.md
          test -f references/motion.md
          test -f references/review.md
          test -f references/prompts.md
          test -f assets/direction-board.html
          sh scripts/verify-install.sh

      - name: Check frontmatter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          frontmatter = text.split("---", 2)[1]
          data = yaml.safe_load(frontmatter)
          assert data["name"] == "zack-ui"
          assert data["description"].strip()

          config = yaml.safe_load(Path("agents/openai.yaml").read_text(encoding="utf-8"))
          assert config["interface"]["display_name"] == "Zack UI"
          assert config["policy"]["allow_implicit_invocation"] is True
          print("skill metadata is valid")
          PY
